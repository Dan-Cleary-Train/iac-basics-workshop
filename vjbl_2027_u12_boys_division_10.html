<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>VJBL 2027 U12 Boys - Division 10 Results</title>
  <style>
    :root {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #17243b;
      background: #f3f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --blue: #233d9b;
      --muted: #647189;
      --border: #dce3ee;
      --panel: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
    }

    header {
      padding: 28px max(20px, calc((100% - 1180px) / 2));
      color: #fff;
      background: linear-gradient(120deg, #1d2f79, #3156bd);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2rem);
    }

    header p {
      margin: 8px 0 0;
      color: #e3eaff;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto 48px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 14px;
      padding: 18px;
      margin-bottom: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 3px 12px #17243b0a;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin: 20px 0 14px;
      border-bottom: 1px solid var(--border);
    }

    .tab-button {
      padding: 11px 17px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
    }

    .tab-button[aria-selected="true"] {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .tab-button:focus-visible {
      outline: 3px solid #3156bd40;
      outline-offset: -3px;
    }

    .tab-panel[hidden] {
      display: none;
    }

    label {
      display: grid;
      gap: 6px;
      color: #3d4d67;
      font-size: .88rem;
      font-weight: 600;
    }

    select,
    input {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      color: #17243b;
      background: #fff;
      border: 1px solid #c9d2e0;
      border-radius: 7px;
      font: inherit;
      font-weight: 400;
    }

    select:focus,
    input:focus {
      border-color: #3156bd;
      outline: 3px solid #3156bd30;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      min-height: 34px;
      margin: 0 2px 12px;
      color: var(--muted);
      font-size: .94rem;
    }

    .game-list {
      display: grid;
      gap: 16px;
    }

    .game {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 3px 12px #17243b0a;
    }

    .game-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 13px 18px;
      color: #40506a;
      background: #f9fbfe;
      border-bottom: 1px solid var(--border);
      font-size: .9rem;
    }

    .grade {
      color: var(--blue);
      font-weight: 700;
    }

    .final {
      padding: 4px 9px;
      color: #1d6b43;
      background: #e6f5ec;
      border-radius: 20px;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 18px;
    }

    .game-overview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 16px 18px;
    }

    .score-team {
      min-width: 0;
    }

    .score-team:last-child {
      text-align: right;
    }

    .team-name {
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .team-score {
      margin-top: 2px;
      color: var(--blue);
      font-size: 1.8rem;
      font-weight: 750;
      line-height: 1.1;
    }

    .versus {
      color: #8a96a9;
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .game-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 16px;
      padding: 0 18px 14px;
      color: var(--muted);
      font-size: .86rem;
    }

    .game-meta a {
      color: var(--blue);
      font-weight: 600;
      text-decoration: none;
    }

    .game-meta a:hover {
      text-decoration: underline;
    }

    details {
      border-top: 1px solid var(--border);
    }

    summary {
      padding: 13px 18px;
      color: var(--blue);
      cursor: pointer;
      font-weight: 650;
      list-style-position: inside;
    }

    .details-content {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 0 18px 18px;
    }

    .team-stats {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .team-stats h3 {
      margin: 0;
      padding: 10px 12px;
      background: #f6f8fc;
      font-size: .95rem;
    }

    .team-stats table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }

    th,
    td {
      padding: 8px 10px;
      border-top: 1px solid #e8edf4;
      text-align: left;
    }

    th {
      color: #51617a;
      background: #fbfcfe;
      font-size: .77rem;
      font-weight: 650;
      text-transform: uppercase;
    }

    th.number,
    td.number {
      width: 52px;
      text-align: right;
    }

    .empty {
      padding: 30px 18px;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed #c9d2e0;
      border-radius: 10px;
      text-align: center;
    }

    .leader-groups {
      display: grid;
      gap: 16px;
    }

    .leader-group {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 3px 12px #17243b0a;
    }

    .leader-group h2 {
      margin: 0;
      padding: 14px 18px;
      background: #f9fbfe;
      border-bottom: 1px solid var(--border);
      color: var(--blue);
      font-size: 1rem;
    }

    .leader-table {
      width: 100%;
      border-collapse: collapse;
    }

    .leader-table td:first-child,
    .leader-table th:first-child {
      width: 60px;
      text-align: right;
    }

    .leader-table td:last-child,
    .leader-table th:last-child {
      width: 150px;
      text-align: right;
    }

    footer {
      padding: 0 16px 28px;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }

    @media (max-width: 760px) {
      .filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .details-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .game-overview {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .game-top,
      .scoreboard,
      .game-meta {
        padding-right: 13px;
        padding-left: 13px;
      }

      .scoreboard {
        gap: 7px;
      }

      .team-score {
        font-size: 1.5rem;
      }

      .team-stats table {
        font-size: .81rem;
      }
    }
  </style>
</head>

  <script>
    const report = JSON.parse(document.getElementById("report-data").textContent);
    const games = report.grades.flatMap((grade) => {
      const match = grade.grade.match(/\bPool\s+(\d+)([A-Z])?\b/i);
      return grade.rounds.flatMap((round) =>
        round.completed_games.map((game) => ({
          ...game,
          grade: grade.grade,
          division: match ? match[1] : "Other",
          pool: match ? (match[2] || "") : ""
        }))
      );
    });

    const divisionFilter = document.getElementById("division-filter");
    const poolFilter = document.getElementById("pool-filter");
    const teamSearch = document.getElementById("team-search");
    const playerSearch = document.getElementById("player-search");
    const gameList = document.getElementById("game-list");
    const resultCount = document.getElementById("result-count");
    const leaderList = document.getElementById("leader-list");
    const scorerCount = document.getElementById("scorer-count");
    const gamesTab = document.getElementById("games-tab");
    const scorersTab = document.getElementById("scorers-tab");
    const gamesPanel = document.getElementById("games-panel");
    const scorersPanel = document.getElementById("scorers-panel");

    function addOption(select, value, label) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      select.append(option);
    }

    const divisions = [...new Set(games.map((game) => game.division))]
      .sort((a, b) => Number(a) - Number(b));
    for (const division of divisions) {
      addOption(divisionFilter, division, `Division ${division}`);
    }

    function updatePoolOptions() {
      const current = poolFilter.value;
      const division = divisionFilter.value;
      const pools = [...new Set(games
        .filter((game) => !division || game.division === division)
        .map((game) => game.pool))]
        .filter(Boolean)
        .sort();

      poolFilter.replaceChildren();
      addOption(poolFilter, "", "All pools");
      for (const pool of pools) {
        addOption(poolFilter, pool, `Pool ${pool}`);
      }
      if (pools.includes(current)) {
        poolFilter.value = current;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function filteredTeams(game, teamTerm, playerTerm) {
      return game.player_statistics.map((stats) => ({
        ...stats,
        players: stats.players.filter((player) =>
          !playerTerm || player.name.toLocaleLowerCase().includes(playerTerm)
        )
      })).filter((stats) =>
        (!teamTerm || stats.team.toLocaleLowerCase().includes(teamTerm))
        && stats.players.length > 0
      );
    }

    function renderTeamStats(stats) {
      const rows = stats.players.map((player) => `
        <tr>
          <td class="number">${player.jersey_number ?? "–"}</td>
          <td>${escapeHtml(player.name)}</td>
          <td class="number">${player.points ?? "–"}</td>
          <td class="number">${player.fouls ?? "–"}</td>
        </tr>`).join("");
      const teamStats = stats.team_stats;
      const teamStatsRow = teamStats && (teamStats.points || teamStats.fouls)
        ? `<tr><td class="number">–</td><td>Team stats</td><td class="number">${teamStats.points ?? 0}</td><td class="number">${teamStats.fouls ?? 0}</td></tr>`
        : "";

      return `
        <section class="team-stats">
          <h3>${escapeHtml(stats.team)}</h3>
          <table>
            <thead>
              <tr><th class="number">#</th><th>Player</th><th class="number">Pts</th><th class="number">F</th></tr>
            </thead>
            <tbody>${rows}${teamStatsRow}</tbody>
          </table>
        </section>`;
    }

    function formatFixtureSummary(summary) {
      const start = summary.search(
        /\b\d{1,2}:\d{2}\s*[AP]M,\s*(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun),?\s+\d{1,2}\s+[A-Za-z]{3}\s+\d{2,4}/i
      );
      return start >= 0 ? summary.slice(start).trim() : summary;
    }

    function renderGame(game, teams) {
      const renderScoreTeam = (team) => `
        <div class="score-team">
          <div class="team-name">${escapeHtml(team.name)}</div>
          <div class="team-score">${team.score}</div>
        </div>`;
      const periodNames = Object.keys(game.teams[0].period_scores);
      const periodRows = game.teams.map((team) => `
        <tr>
          <td>${escapeHtml(team.name)}</td>
          ${periodNames.map((period) => `<td class="number">${team.period_scores[period] ?? "–"}</td>`).join("")}
          <td class="number"><strong>${team.score}</strong></td>
        </tr>`).join("");
      const periodHeaders = periodNames.map((period) => `<th class="number">${escapeHtml(period)}</th>`).join("");
      const teamDetails = teams.map(renderTeamStats).join("");
      const dateAndVenue = escapeHtml(formatFixtureSummary(game.fixture_summary));

      return `
        <article class="game">
          <div class="game-top">
            <span><span class="grade">${escapeHtml(game.grade)}</span> · Round ${game.round}</span>
            <span class="final">${escapeHtml(game.status)}</span>
          </div>
          <div class="game-overview">
            <section class="team-stats">
              <h3>Final score</h3>
              <div class="scoreboard">
                ${renderScoreTeam(game.teams[0])}
                <span class="versus">vs</span>
                ${renderScoreTeam(game.teams[1])}
              </div>
            </section>
            <section class="team-stats">
              <h3>Quarter-by-quarter scores</h3>
              <table>
                <thead><tr><th>Team</th>${periodHeaders}<th class="number">Total</th></tr></thead>
                <tbody>${periodRows}</tbody>
              </table>
            </section>
          </div>
          <div class="game-meta">
            <span>${dateAndVenue}</span>
            <a href="${escapeHtml(game.url)}" target="_blank" rel="noopener noreferrer">PlayHQ game details ↗</a>
          </div>
          <details>
            <summary>Player statistics</summary>
            <div class="details-content">
              ${teamDetails}
            </div>
          </details>
        </article>`;
    }

    function renderTopScorers(division, pool, teamTerm, playerTerm) {
      const totals = new Map();
      for (const game of games) {
        if (division && game.division !== division) continue;
        if (pool && game.pool !== pool) continue;

        for (const team of game.player_statistics) {
          for (const player of team.players) {
            const key = `${game.division}\u0000${team.team}\u0000${player.name}`;
            if (!totals.has(key)) {
              totals.set(key, {
                division: game.division,
                team: team.team,
                name: player.name,
                points: 0
              });
            }
            totals.get(key).points += player.points ?? 0;
          }
        }
      }

      const byDivision = new Map();
      for (const scorer of totals.values()) {
        if (!byDivision.has(scorer.division)) byDivision.set(scorer.division, []);
        byDivision.get(scorer.division).push(scorer);
      }

      const groups = [];
      for (const [divisionNumber, scorers] of byDivision) {
        const filteredScorers = scorers.filter((scorer) =>
          (!teamTerm || scorer.team.toLocaleLowerCase().includes(teamTerm))
          && (!playerTerm || scorer.name.toLocaleLowerCase().includes(playerTerm))
        );
        filteredScorers.sort((first, second) =>
          second.points - first.points
          || first.name.localeCompare(second.name)
          || first.team.localeCompare(second.team)
        );
        if (filteredScorers.length) {
          groups.push({division: divisionNumber, scorers: filteredScorers});
        }
      }

      const playerTotal = groups.reduce((total, group) => total + group.scorers.length, 0);
      scorerCount.textContent = `${playerTotal} player${playerTotal === 1 ? "" : "s"} across ${groups.length} division${groups.length === 1 ? "" : "s"}`;
      leaderList.innerHTML = groups.length
        ? groups.map((group) => `
          <section class="leader-group">
            <h2>Division ${escapeHtml(group.division)}${pool ? ` · Pool ${escapeHtml(pool)}` : ""}</h2>
            <table class="leader-table">
              <thead><tr><th>#</th><th>Player</th><th>Team</th><th>Total points</th></tr></thead>
              <tbody>${group.scorers.map((scorer, index) => `
                <tr>
                  <td>${index + 1}</td>
                  <td>${escapeHtml(scorer.name)}</td>
                  <td>${escapeHtml(scorer.team)}</td>
                  <td>${scorer.points}</td>
                </tr>`).join("")}</tbody>
            </table>
          </section>`).join("")
        : '<div class="empty">No top scorers match those filters.</div>';
    }

    function render() {
      const division = divisionFilter.value;
      const pool = poolFilter.value;
      const teamTerm = teamSearch.value.trim().toLocaleLowerCase();
      const playerTerm = playerSearch.value.trim().toLocaleLowerCase();
      const matchingGames = [];

      for (const game of games) {
        if (division && game.division !== division) continue;
        if (pool && game.pool !== pool) continue;
        const teams = filteredTeams(game, teamTerm, playerTerm);
        if (teams.length) matchingGames.push({game, teams});
      }

      const playersShown = matchingGames.reduce(
        (total, item) => total + item.teams.reduce((count, team) => count + team.players.length, 0),
        0
      );
      resultCount.textContent = `${matchingGames.length} game${matchingGames.length === 1 ? "" : "s"} · ${playersShown} player row${playersShown === 1 ? "" : "s"}`;
      gameList.innerHTML = matchingGames.length
        ? matchingGames.map(({game, teams}) => renderGame(game, teams)).join("")
        : '<div class="empty">No games match those filters.</div>';
      renderTopScorers(division, pool, teamTerm, playerTerm);
    }

    function activateTab(tab) {
      const showGames = tab === "games";
      gamesTab.setAttribute("aria-selected", String(showGames));
      gamesTab.tabIndex = showGames ? 0 : -1;
      scorersTab.setAttribute("aria-selected", String(!showGames));
      scorersTab.tabIndex = showGames ? -1 : 0;
      gamesPanel.hidden = !showGames;
      scorersPanel.hidden = showGames;
    }

    divisionFilter.addEventListener("change", () => {
      updatePoolOptions();
      render();
    });
    poolFilter.addEventListener("change", render);
    teamSearch.addEventListener("input", render);
    playerSearch.addEventListener("input", render);
    gamesTab.addEventListener("click", () => activateTab("games"));
    scorersTab.addEventListener("click", () => activateTab("scorers"));

    updatePoolOptions();
    render();
  </script>
</body>
</html>
